name: Run Daily Ad Bot

on:
  workflow_dispatch: # Manual triggering only

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python & Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Cache Playwright Chromium Browser (~150MB)
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Only downloads full browser binaries if cache missed
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      # Fast path: Installs only system libraries if browser binary is cached
      - name: Install System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run Script
        env:
          ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
        run: python -u bot.py

      - name: Upload Execution Videos
        if: always() # Uploads videos on success, failure, OR manual cancel
        uses: actions/upload-artifact@v4
        with:
          name: execution-videos
          path: videos/
          if-no-files-found: warn
          retention-days: 7
