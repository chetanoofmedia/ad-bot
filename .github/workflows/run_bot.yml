name: Run Daily Ad Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '5 16 * * *' # Auto-runs daily at 9:35 PM IST (16:05 UTC)

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright, Linux Dependencies & Xvfb
        run: |
          pip install playwright
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Script in Headful Mode (via Xvfb)
        env:
          ALL_EMAILS: ${{ secrets.ALL_EMAILS }}
          ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -u bot.py

      - name: Upload Execution Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-recorded-videos
          path: videos/
          retention-days: 3
